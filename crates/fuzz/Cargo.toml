[package]
name = "monty-fuzz"
publish = false
version = { workspace = true }
edition = { workspace = true }

[package.metadata]
cargo-fuzz = true

[dependencies]
arbitrary = { version = "1", features = ["derive"] }
libfuzzer-sys = "0.4"
monty = { workspace = true }
# Only the `ast_panic` target and the `fuzz_tool` example install it as the
# global allocator, which is what makes `ResourceLimits::max_memory` enforced.
monty-alloc = { workspace = true }
monty-types = { workspace = true }

[features]
# Forwards Monty's leak detector: dropping a `Value::Ref` without `drop_with`
# panics, and garbage collection runs on every allocation. Very slow.
memory-model-checks = ["monty/memory-model-checks"]

[[bin]]
name = "string_input_panic"
path = "fuzz_targets/string_input_panic.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tokens_input_panic"
path = "fuzz_targets/tokens_input_panic.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ast_panic"
path = "fuzz_targets/ast_panic.rs"
test = false
doc = false
bench = false

[lints]
workspace = true
